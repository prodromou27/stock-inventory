name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stock_inventory
          POSTGRES_USER: stock_inventory
          POSTGRES_PASSWORD: stock_inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: stock_inventory
      POSTGRES_USER: stock_inventory
      POSTGRES_PASSWORD: stock_inventory
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # static/css/app.css is generated (gitignored — CLAUDE.md's "Frontend
      # build" section) and templates reference it directly, so it needs to
      # exist before pytest renders any page.
      - name: Install npm dependencies and build CSS
        run: |
          npm ci
          npm run build:css
          npm run build:vendor

      # WeasyPrint's PDF-rendering dependencies (docs/architecture/06-documents-and-snapshots.md)
      # — same packages deploy/Dockerfile installs for the app image.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Migration drift check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest -q

      # Chromium's own OS-level dependencies (fonts, GTK/NSS libs, etc.) —
      # separate from the WeasyPrint apt packages above, which only cover
      # PDF rendering, not running a real browser.
      - name: Install Playwright's Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Browser QA (document editor + generation, template lifecycle)
        env:
          RUN_BROWSER_TESTS: "1"
        run: pytest tests/test_document_browser.py -q

      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: .qa-screenshots/
          if-no-files-found: ignore
