services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-stock_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_inventory}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Compiles static/css/app.css from assets/tailwind/input.css and rebuilds
  # on every save (CLAUDE.md's "Frontend build" section). A separate
  # container rather than folding this into `web`'s image build: `web`
  # bind-mounts the whole repo (`..:/app` above), which would shadow
  # anything Tailwind-built at image-build time anyway, so a live watcher
  # writing straight to the same bind-mounted static/css/ is the only setup
  # that actually keeps CSS edits picked up without a rebuild. Not needed in
  # production — deploy/Dockerfile.prod's `assets` build stage compiles this
  # once at image build instead, since that image never bind-mounts source.
  assets:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm ci && npm run watch:css"

volumes:
  db_data:
