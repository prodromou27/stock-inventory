services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only `web` (and an operator running
    # `docker compose exec db ...` for backup/restore/hardening) reach it.

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    restart: unless-stopped
    # No `..:/app` bind mount here (unlike deploy/docker-compose.yml, dev
    # only) — the image is the deployable artifact; code changes require a
    # rebuild, never a live-edited container.
    volumes:
      - media_data:/app/media
      # Read-write here, read-only in `proxy` below — lets Settings > TLS
      # certificate (apps.settings.services.update_certificate) write a
      # newly-uploaded cert to the same host directory proxy serves from,
      # without needing web to reach into proxy's container (e.g. a
      # docker.sock mount) to do it. proxy still needs a manual restart to
      # pick up the change — see that view/template and DEPLOYMENT.md.
      - ./certs:/app/deploy/certs
    env_file:
      - ../.env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not published to the host — only `proxy` reaches it, over the compose
    # network, on the plain-HTTP port gunicorn listens on.

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Pure TLS-terminating reverse proxy — static files are served by
    # WhiteNoise from inside `web` (already the CompressedManifestStaticFilesStorage
    # backend, verified locally), not by nginx directly, so there's no
    # separate static-files volume to keep in sync with what's baked into
    # the `web` image at build time.
    volumes:
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy

volumes:
  db_data:
  media_data:
