{% extends "base.html" %}

{% block title %}Log in — Stock Inventory{% endblock %}

{% block content %}
  <h1>Welcome back</h1>
  <p class="auth-card__intro">Sign in to manage inventory, movements, and reports.</p>
  {% if form.errors %}
    <p class="messages__item messages__item--error">Incorrect username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--primary auth-submit">Log in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
