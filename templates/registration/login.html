{% extends "base.html" %}

{% block title %}Log in — Stock Inventory{% endblock %}

{% block content %}
  <h1>Log in</h1>
  {% if form.errors %}
    <p class="messages__item messages__item--error">Incorrect username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
