{% extends "base.html" %}

{% block title %}Reserve Stock — Stock Inventory{% endblock %}

{% block content %}
  <h1>Reserve stock</h1>
  {% if form.non_field_errors %}
    <p class="messages__item messages__item--error">{{ form.non_field_errors|join:" " }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% include "inventory/_asset_picker.html" %}
    <button type="submit">Reserve</button>
  </form>
{% endblock %}
