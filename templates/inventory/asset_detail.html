{% extends "base.html" %}
{% load ui_extras %}

{% block title %}{{ asset.product }} — Stock Inventory{% endblock %}

{% block content %}
  <div class="page-header">
    <h1>{{ asset.product }}</h1>
    {% if user_is_administrator %}
      <div class="page-header__actions">
        <a class="btn" href="{% url 'inventory:asset_correct' asset.pk %}">Administrator correction</a>
      </div>
    {% endif %}
  </div>

  {% include "inventory/_asset_detail_content.html" %}
{% endblock %}
