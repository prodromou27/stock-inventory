<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong — Stock Inventory</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55; background: #f4f6f8; color: #1c2530;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f1216; color: #e7eaee; } }
    main {
      max-width: 26rem; margin: 2rem; padding: 2rem 2.25rem;
      background: #fff; border: 1px solid #dde2e7; border-radius: 12px;
      box-shadow: 0 6px 16px rgba(16, 24, 40, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      main { background: #171b21; border-color: #2a2f37; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45); }
    }
    h1 { font-size: 1.2rem; margin: 0 0 0.75rem; }
    a {
      display: inline-flex; margin-top: 0.5rem; padding: 0.5rem 0.9rem; font-size: 0.85rem; font-weight: 600;
      border-radius: 5px; background: #1d4ed8; color: #fff; text-decoration: none;
    }
    a:hover { background: #1a3fb0; }
  </style>
</head>
<body>
  <main>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred. The problem has been logged — please try again, and contact an
      Administrator if it keeps happening.</p>
    <a href="{% url 'core:home' %}">Return to the dashboard</a>
  </main>
</body>
</html>
