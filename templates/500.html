{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Something went wrong — Stock Inventory</title>
  <link rel="icon" href="{% static 'icons/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card error-card" aria-labelledby="error-title">
      <div class="error-code">500</div>
      <h1 id="error-title">Something went wrong</h1>
      <p>The problem has been logged. Try again, or contact an Administrator if it continues.</p>
      <a class="btn btn--primary" href="{% url 'core:home' %}">Return to the dashboard</a>
    </section>
  </main>
</body>
</html>
