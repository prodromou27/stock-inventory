{% if company_name or company_address or company_tax_id %}
    <div class="company-info">
      {% if company_name %}<p><strong data-editor-field="company_name">{{ company_name }}</strong></p>{% endif %}
      {% if company_address %}<p data-editor-field="company_address">{{ company_address|linebreaksbr }}</p>{% endif %}
      {% if company_tax_id %}<p>Tax ID: {{ company_tax_id }}</p>{% endif %}
    </div>
  {% endif %}
