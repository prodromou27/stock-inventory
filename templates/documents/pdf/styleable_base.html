<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ document_number }}</title>
<style>
  @page {
    size: {{ page_size }} {{ orientation }};
    margin: __PAGE_MARGIN_CM__cm;
    {% if header_text %}@top-center { content: "{{ header_text }}"; font-size: 8pt; color: #666; }{% endif %}
    {% if footer_text %}@bottom-left { content: "{{ footer_text }}"; font-size: 8pt; color: #666; }{% endif %}
    {% if show_page_numbers %}@bottom-right { content: "Page " counter(page) " of " counter(pages); font-size: 8pt; color: #666; }{% endif %}
  }
  body { font-family: __FONT_STACK__; font-size: {{ body_font_size }}pt; color: #111; }
  h1 { font-size: {{ heading_font_size }}pt; margin: 0; color: {{ heading_text_color }}; }
  .letterhead {
    display: flex;
    align-items: center;
    gap: 1em;
    margin-bottom: var(--section-gap, 1em);
    padding-bottom: 0.5em;
    border-bottom: 2px solid __ACCENT_COLOR__;
  }
  .letterhead--left { justify-content: flex-start; }
  .letterhead--center { justify-content: center; flex-direction: column; text-align: center; gap: 0.3em; }
  .letterhead--right { justify-content: flex-end; flex-direction: row-reverse; }
  .letterhead__logo { max-height: 2.2cm; max-width: 6cm; }
  .company-info { margin: 0 0 var(--section-gap, 1em); font-size: 8.5pt; color: #333; }
  .company-info p { margin: 0.1em 0; }
  .meta { margin-top: var(--section-gap, 1em); }
  .meta p { margin: 0.15em 0; }
  table { width: 100%; border-collapse: collapse; margin-top: var(--section-gap, 1em); }
  /* Multipage line-item tables: repeat the header row on every page and
     never split a row across a page break — without these two rules a long
     delivery/disposal's line items render fine on page 1 and then silently
     lose their header (or slice a row in half) on every page after it. */
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  th, td { border: 1px solid #444; padding: {{ table_cell_padding }}px; text-align: left; font-size: {{ table_font_size }}pt; vertical-align: top; }
  th { background: {{ table_header_bg_color }}; }
  .notes { margin-top: var(--section-gap, 1em); }
  .terms { margin-top: var(--section-gap, 1em); font-size: 8.5pt; color: #333; }
  .disposal-certificate { margin-top: var(--section-gap, 1em); padding: 0.6em 0.8em; border: 1px solid #444; }
  .disposal-certificate p { margin: 0.2em 0; }
  .signatures { margin-top: 3em; width: 100%; }
  .signatures td { border: none; padding: 0 1em 0 0; width: 50%; }
  .signature-line { border-bottom: 1px solid #000; height: 2.5em; }
  .signature-caption { margin-top: 0.3em; font-size: 9pt; }
  :root { --section-gap: {{ section_spacing_em }}; }
  .acceptance-letterhead { min-height: 3.1cm; position: relative; }
  .acceptance-letterhead .letterhead__logo { max-width: 6cm; max-height: 1.5cm; }
  .acceptance-reference { position: absolute; right: 0; top: 1.3cm; min-width: 3cm;
    padding: .2cm; border: 1px solid __ACCENT_COLOR__; color: __ACCENT_COLOR__;
    text-align: center; font-weight: bold; }
  .acceptance-date { text-align: right; margin: .8cm 0 1cm; }
  .acceptance-title { text-align: center; margin-bottom: .9cm; }
  .acceptance-introduction { line-height: 1.9; margin-bottom: 1.2cm; }
  .acceptance-customer { margin-top: 1cm; }
  .acceptance-signatures p { margin: 1cm 0; }
</style>
</head>
<body>
  {% for section_template in document_sections %}
    {% include section_template %}
  {% endfor %}
</body>
</html>
