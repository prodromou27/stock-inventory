{% extends "base.html" %}

{% block title %}New location — Stock Inventory{% endblock %}

{% block content %}
  <h1>New location</h1>
  {% if form.non_field_errors %}
    <p class="messages__item messages__item--error">{{ form.non_field_errors|join:" " }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create</button>
  </form>
{% endblock %}
